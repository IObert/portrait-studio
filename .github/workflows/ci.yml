name: CI

# Only GitHub-owned actions (actions/*): the org's Actions policy allows nothing else.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @portrait-studio/print-agent build

  # The print agent must keep running on the booth computer's Node 22 (SPEC §11.1).
  print-agent-node22:
    name: Print agent on Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @portrait-studio/print-agent
      - run: pnpm --filter @portrait-studio/print-agent test
      - run: pnpm --filter @portrait-studio/print-agent build
      - run: node apps/print-agent/dist/agent.mjs --help
      # The bundle must actually start on Node 22 (twilio-sync is CommonJS).
      - run: node apps/print-agent/dist/agent.mjs --version
      - name: Bundle rejects a bad invocation instead of crashing
        run: |
          set +e
          out=$(node apps/print-agent/dist/agent.mjs --url https://example.test --token tooshort 2>&1)
          code=$?
          echo "$out"
          [ "$code" = "2" ] || { echo "expected exit 2, got $code"; exit 1; }
          echo "$out" | grep -q -- "--token" || { echo "missing argument error"; exit 1; }

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portrait-studio/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag portrait-studio:ci .
      # The worker runs from source in the image: prove every module it imports is there.
      - name: Worker starts in the image
        run: docker run --rm --workdir /repo/apps/web portrait-studio:ci node --conditions=react-server --import tsx worker/main.ts --check
      - name: Web server starts in the image
        run: |
          docker run -d --name web -p 3000:3000 portrait-studio:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && exit 0; sleep 1; done
          docker logs web; exit 1
