# Local development stack (works with `docker compose` and `podman compose`).
# Copy .env.example to .env.local first, and start with
#   docker compose --env-file .env.local up --build     (or: podman compose ...)
# --env-file is required: Compose fills ${...} below from that file, so a real
# AZURE_STORAGE_CONNECTION_STRING in it is used, and an empty one falls back to Azurite.
# Without the flag Compose reads only .env and the shell, and always uses Azurite.
# (Another file: ENV_FILE=.env.staging docker compose --env-file .env.staging up)
services:
  web:
    build: .
    image: localhost/portrait-studio:dev
    env_file: ${ENV_FILE:-.env.local}
    restart: unless-stopped
    environment:
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      - azurite

  # Same image as web, started with the worker command (SPEC §3.2).
  worker:
    image: localhost/portrait-studio:dev
    pull_policy: never
    command: ["/repo/apps/web/worker/start.sh"]
    env_file: ${ENV_FILE:-.env.local}
    restart: unless-stopped
    environment:
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
    healthcheck:
      disable: true
    depends_on:
      - web
      - azurite

  # Local Azure Blob Storage emulator. Its account key is Microsoft's public,
  # well-known development key, not a secret.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # --skipApiVersionCheck: the SDK often targets a newer API version than Azurite.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--loose", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
